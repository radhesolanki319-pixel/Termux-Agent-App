name: Build Termux Agent App

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDK platform, build-tools and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3" "ndk;22.1.7171670"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Custom bootstrap for com.tagent (aarch64)
        run: |
          set -e
          mkdir -p /tmp/boot && cd /tmp/boot
          curl -sL -o bootstrap-aarch64.zip "https://github.com/termux/termux-packages/releases/download/bootstrap-2025.03.28-r1%2Bapt-android-7/bootstrap-aarch64.zip"
          echo "c8d702b6f742935001c37cda81b8ac69504a95d5cf28f2899532dd8cd4b057eb  bootstrap-aarch64.zip" | sha256sum -c -
          mkdir x && cd x && unzip -q ../bootstrap-aarch64.zip
          ORIG_COUNT=$(find . -type f | wc -l)
          grep -rl 'com\.termux' . | while read -r f; do sed -i 's|com\.termux|com.tagent|g' "$f"; done
          LEFT=$(grep -rl 'com\.termux' . | wc -l)
          echo "Files still containing old package string: $LEFT"
          [ "$LEFT" -eq 0 ]
          [ "$(find . -type f | wc -l)" -eq "$ORIG_COUNT" ]
          [ -z "$(find . -name '*com.termux*' -print -quit)" ]
          readelf -d bin/bash | grep -q '/data/data/com.tagent/files/usr/lib'
          echo "Bootstrap rewrite verified: RUNPATH + saare embedded path com.tagent par"
          cp "$GITHUB_WORKSPACE/ci/bootstrap-extras/98-agent-provider.sh" etc/profile.d/
          cp "$GITHUB_WORKSPACE/ci/bootstrap-extras/99-termux-agent-setup.sh" etc/profile.d/
          mkdir -p etc/termux-agent
          cp "$GITHUB_WORKSPACE/ci/bootstrap-extras/first-setup.sh" etc/termux-agent/
          mv bin/dpkg bin/dpkg-real
          cp "$GITHUB_WORKSPACE/ci/bootstrap-extras/dpkg-wrapper.sh" bin/dpkg
          chmod 755 bin/dpkg
          mkdir -p share/termux-agent etc/dpkg
          cp "$GITHUB_WORKSPACE/ci/bootstrap-extras/dpkg-wrapper.sh" share/termux-agent/
          cp "$GITHUB_WORKSPACE/ci/bootstrap-extras/restore-dpkg-wrapper.sh" share/termux-agent/
          cp "$GITHUB_WORKSPACE/ci/bootstrap-extras/97-dpkg-wrapper-guard.sh" etc/profile.d/
          printf 'post-invoke="/data/data/com.tagent/files/usr/share/termux-agent/restore-dpkg-wrapper.sh"\n' > etc/dpkg/dpkg.cfg
          zip -qr ../bootstrap-aarch64-agent.zip .
          cd ..
          NEW=$(sha256sum bootstrap-aarch64-agent.zip | awk '{print $1}')
          echo "Custom bootstrap sha256: $NEW"
          cp bootstrap-aarch64-agent.zip "$GITHUB_WORKSPACE/app/src/main/cpp/bootstrap-aarch64.zip"
          sed -i "s|c8d702b6f742935001c37cda81b8ac69504a95d5cf28f2899532dd8cd4b057eb|$NEW|" "$GITHUB_WORKSPACE/app/build.gradle"
          grep -n 'downloadBootstrap("aarch64"' "$GITHUB_WORKSPACE/app/build.gradle"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-agent-app-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release with aarch64 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="agent-v1"
          APK=$(ls app/build/outputs/apk/debug/*arm64-v8a*.apk | head -1)
          echo "Publishing $APK"
          cp "$APK" Termux-Agent-App.apk
          gh release create "$TAG" --title "Termux Agent App v1" --notes "Test build: Termux Agent App (package com.tagent, custom aarch64 bootstrap — binary-level rewrite, CI-verified). Pehli baar khulne par agent toolkit ka automatic setup chalega. Debug signature — sirf test ke liye." Termux-Agent-App.apk || gh release upload "$TAG" Termux-Agent-App.apk --clobber
